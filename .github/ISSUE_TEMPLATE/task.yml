name: Task
description: A unit of work for a human or agent (one issue = one branch = one PR)
labels: [task]
body:
  - type: textarea
    id: goal
    attributes: {label: Goal, description: What and why, in 1-3 lines}
    validations: {required: true}
  - type: textarea
    id: criteria
    attributes: {label: Acceptance criteria, description: Observable, testable bullets}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes: {label: Scope / files, description: In scope and explicitly out of scope}
  - type: dropdown
    id: type
    attributes: {label: Type, options: [feat, fix, chore, test, docs, refactor]}
    validations: {required: true}
